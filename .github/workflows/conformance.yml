name: Cloud conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run, or all
        required: true
        default: all
        type: choice
        options:
          - all
          - step
          - wait
          - child
          - callback
          - invoke
          - wait_for_condition
          - wait_for_callback
          - parallel
          - map
          - plugin

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: ${{ matrix.suite }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-conformance-stack-${{ matrix.suite }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.suite == 'all') && '["step","wait","child","callback","invoke","wait_for_condition","wait_for_callback","parallel","map","plugin"]' || format('["{0}"]', inputs.suite)) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: gradle/actions/setup-gradle@v4

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.INTEGRATION_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: durable-execution-kotlin-conformance

      - name: Check integration account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "${{ secrets.INTEGRATION_ACCOUNT }}"

      - name: Install conformance runner
        run: |
          git clone --depth 1 https://github.com/aws/aws-durable-execution-conformance-tests.git .conformance
          pip install ./.conformance/packages/aws-durable-execution-conformance-tests

      - name: Build and test
        run: ./gradlew build

      - name: Run ${{ matrix.suite }} conformance
        env:
          CONFORMANCE_SUITE: ${{ matrix.suite }}
        run: |
          stack_suite="${CONFORMANCE_SUITE//_/-}"
          python -m aws_durable_execution_conformance_tests.app \
            --template "conformance-tests/template_${CONFORMANCE_SUITE}.yaml" \
            --language kotlin \
            --region us-west-2 \
            --suite "${CONFORMANCE_SUITE}" \
            --name "kotlin-${stack_suite}-persistent" \
            --history-dir "conformance-output/${CONFORMANCE_SUITE}" \
            --report console json junit github \
            --report-file "conformance-output/${CONFORMANCE_SUITE}/report" \
            --fail-on failed+uncovered \
            --no-cleanup

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.suite }}
          path: conformance-output/${{ matrix.suite }}
          if-no-files-found: ignore
