name: Cloud conformance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run, or all
        required: true
        default: all
        type: choice
        options:
          - all
          - step
          - wait
          - child
          - callback
          - invoke
          - wait_for_condition
          - wait_for_callback
          - parallel
          - map
          - plugin

permissions:
  contents: read
  id-token: write

jobs:
  conformance:
    name: ${{ matrix.suite }}
    if: ${{ inputs.suite == 'all' || inputs.suite == matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - step
          - wait
          - child
          - callback
          - invoke
          - wait_for_condition
          - wait_for_callback
          - parallel
          - map
          - plugin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: gradle/actions/setup-gradle@v4

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.INTEGRATION_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: durable-execution-kotlin-conformance

      - name: Check integration account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "${{ secrets.INTEGRATION_ACCOUNT }}"

      - name: Install conformance runner
        run: |
          git clone --depth 1 https://github.com/aws/aws-durable-execution-conformance-tests.git .conformance
          pip install ./.conformance/packages/aws-durable-execution-conformance-tests

      - name: Build and test
        run: ./gradlew build

      - name: Run ${{ matrix.suite }} conformance
        run: |
          python -m aws_durable_execution_conformance_tests.app \
            --template "conformance-tests/template_${{ matrix.suite }}.yaml" \
            --language kotlin \
            --region us-west-2 \
            --suite "${{ matrix.suite }}" \
            --name "kotlin-${{ matrix.suite }}-${{ github.run_id }}" \
            --history-dir "conformance-output/${{ matrix.suite }}" \
            --report console json junit github \
            --report-file "conformance-output/${{ matrix.suite }}/report" \
            --fail-on failed+uncovered

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.suite }}
          path: conformance-output/${{ matrix.suite }}
          if-no-files-found: ignore
